<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b3f6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="考研打卡">
<title>2028考研打卡 · 深大085405</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#f5f7fa;--card:#fff;--text:#1f2937;--muted:#8b95a5;--line:#e8edf3;
    --ok:#2fb38a;--warn:#e8833a;--miss:#c9576e;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);
    padding:20px 16px calc(60px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;
  }
  .wrap{max-width:820px;margin:0 auto;}

  .card{
    background:var(--card);border-radius:16px;padding:18px 20px;
    margin-bottom:16px;border:1px solid var(--line);
    box-shadow:0 2px 12px rgba(20,40,80,.05);
  }
  .card-head{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:14px;flex-wrap:wrap;gap:6px;
  }
  .card-head h2{font-size:16px;font-weight:600;}
  .hint,.date-chip{font-size:12px;color:var(--muted);}
  .date-chip{background:#eef2f8;padding:3px 10px;border-radius:20px;color:#5a6b85;}
  .empty{font-size:13px;color:var(--muted);padding:8px 0;}
  .empty.ok{color:var(--ok);}

  /* 倒计时 */
  .countdown-card{
    background:linear-gradient(135deg,#2b3f6b,#3d5a99);
    color:#fff;border:none;position:relative;overflow:hidden;
  }
  .countdown-card::after{
    content:"";position:absolute;right:-40px;top:-40px;
    width:160px;height:160px;border-radius:50%;
    background:rgba(255,255,255,.06);
  }
  .cd-top{
    display:flex;justify-content:space-between;align-items:center;
    font-size:13px;opacity:.85;margin-bottom:14px;position:relative;z-index:1;
  }
  .cd-edit{cursor:pointer;opacity:.7;font-size:15px;padding:4px;}
  .cd-edit:hover{opacity:1;}
  .cd-main{display:flex;align-items:baseline;gap:8px;position:relative;z-index:1;}
  .cd-num{font-size:68px;font-weight:700;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums;}
  .cd-unit{font-size:20px;opacity:.8;}
  .cd-sub{font-size:13px;opacity:.75;margin-top:10px;position:relative;z-index:1;}
  .cd-phase{
    display:inline-block;background:rgba(255,255,255,.15);
    padding:3px 10px;border-radius:20px;font-size:12px;margin-left:6px;
  }
  .phase-bar-wrap{margin-top:14px;height:5px;background:rgba(255,255,255,.18);border-radius:6px;overflow:hidden;position:relative;z-index:1;}
  .phase-bar-fill{height:100%;background:rgba(255,255,255,.85);border-radius:6px;transition:width .3s;}
  .phase-tip{font-size:11px;opacity:.6;margin-top:8px;position:relative;z-index:1;}

  /* 今日任务 */
  .group-title{
    display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#41506a;
    margin:14px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line);
  }
  .group-title:first-child{margin-top:0;}
  .group-title .group-total{
    margin-left:auto;font-size:12px;font-weight:400;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .sub-task{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;
    cursor:pointer;transition:.15s;margin-bottom:4px;border:1px solid transparent;
  }
  .sub-task:hover{background:#f7faff;border-color:#dae7fa;}
  .sub-task:active{transform:scale(.995);background:#eef4ff;}
  .sub-task .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .sub-task .sub-name{font-size:13px;font-weight:500;min-width:90px;}
  .sub-task .sub-progress{
    flex:1;font-size:12px;color:var(--muted);
    font-variant-numeric:tabular-nums;text-align:right;
  }
  .sub-task .sub-progress b{color:#41506a;font-weight:600;font-size:14px;}
  .sub-task .sub-progress .goal{color:#b0bbc9;}
  .sub-task .bar{flex:1.4;height:6px;background:#eef2f7;border-radius:6px;overflow:hidden;min-width:50px;}
  .sub-task .bar-fill{height:100%;border-radius:6px;transition:width .3s;}
  .sub-task.is-done .sub-name{color:var(--muted);}
  .sub-task.is-done .sub-progress b{color:var(--ok);}
  .sub-task.is-done::after{content:"✓";color:var(--ok);font-weight:700;font-size:14px;}
  .sub-task.is-extra .sub-name::after{
    content:"+";color:#c9a13a;font-size:10px;margin-left:3px;
    background:#fff5d6;padding:1px 5px;border-radius:6px;
  }
  .sub-task .start-icon{
    font-size:11px;color:#b8c3d1;padding:2px 7px;border-radius:6px;background:#f3f6fa;font-weight:500;
  }
  .sub-task:hover .start-icon{background:#e4efff;color:#5b8def;}

  .today-summary{
    margin-top:16px;padding:14px 16px;border-radius:12px;background:#f8fafc;font-size:13px;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  }
  .today-summary.done{background:linear-gradient(135deg,#e8faf1,#d3f3e3);}
  .today-summary .ts-main{color:#41506a;}
  .today-summary .ts-main b{font-size:18px;color:#3d5a99;font-variant-numeric:tabular-nums;font-weight:700;}
  .today-summary.done .ts-main b{color:#2a8f6a;}
  .today-summary .ts-remain{color:#e8833a;font-weight:600;font-size:13px;}
  .today-summary.done .ts-remain{color:#2fb38a;}

  /* 待补 */
  .carry-group{margin-bottom:12px;}
  .carry-group:last-child{margin-bottom:0;}
  .carry-group-title{
    font-size:12px;color:#8a5a2b;font-weight:600;margin-bottom:6px;
    display:flex;align-items:center;gap:6px;
  }
  .carry-items{display:flex;flex-wrap:wrap;gap:8px;}
  .carry-item{
    display:flex;align-items:center;gap:6px;background:#fff7ed;border:1px solid #fde4c8;
    padding:5px 11px;border-radius:9px;font-size:12px;
  }
  .carry-name{color:#8a5a2b;}
  .carry-val{font-weight:700;color:#c2701c;font-variant-numeric:tabular-nums;}
  .carry-tip{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.7;}

  /* 周表 */
  .week-table{width:100%;border-collapse:collapse;font-size:13px;}
  .week-table th{font-weight:500;color:var(--muted);font-size:12px;text-align:center;padding:6px 2px;}
  .week-table th:first-child{text-align:left;padding-left:4px;}
  .week-table td{
    text-align:center;padding:8px 2px;
    font-variant-numeric:tabular-nums;color:#6b7a90;
  }
  .week-table td:first-child{text-align:left;padding-left:4px;}
  .week-table .day-cell{font-size:13px;color:#41506a;font-weight:500;cursor:pointer;}
  .week-table .day-cell:hover{color:#3d5a99;}
  .week-table .dnum{font-size:11px;color:var(--muted);margin-left:5px;}
  .week-table .ok{color:var(--ok);font-weight:600;}
  .week-table .part{color:var(--warn);font-weight:600;}
  .week-table .miss{color:var(--miss);}
  .week-table .na{color:#c8d1dc;}
  .week-table .sum{font-weight:600;color:#41506a;}
  .week-table .sl{font-size:11px;font-weight:400;color:#b0bbc9;}
  .week-table tbody tr{border-top:1px solid #f2f6fa;}
  .week-table tr.today-row{background:#f7faff;}
  .week-table tr.today-row .day-cell{color:#3d5a99;}

  /* 统计 */
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
  .stat-item{background:#f8fafc;border-radius:12px;padding:12px 8px;text-align:center;}
  .stat-val{
    font-size:20px;font-weight:700;color:#3d5a99;
    font-variant-numeric:tabular-nums;line-height:1.1;
  }
  .stat-val small{font-size:11px;font-weight:400;color:var(--muted);}
  .stat-label{font-size:11px;color:var(--muted);margin-top:5px;}
  .subject-stats{display:flex;flex-wrap:wrap;gap:8px;}
  .subj-stat{
    flex:1;min-width:100px;display:flex;align-items:center;gap:7px;
    background:#f8fafc;border-radius:10px;padding:8px 12px;font-size:12px;
  }
  .subj-stat .val{
    margin-left:auto;font-weight:700;color:#41506a;font-variant-numeric:tabular-nums;font-size:12px;
  }
  .subj-stat .val small{font-size:10px;color:var(--muted);font-weight:400;}
  .milestones{
    display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;
    padding-top:14px;border-top:1px solid var(--line);
  }
  .milestone{
    display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;
    background:#f5f7fa;font-size:12px;color:#b0bbc9;transition:.2s;
  }
  .milestone.achieved{background:linear-gradient(135deg,#fff8e0,#ffe9a8);color:#a06a00;}
  .milestone .icon{font-size:13px;}

  /* 日历 */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-nav button{
    background:#f5f7fa;border:1px solid var(--line);width:34px;height:34px;border-radius:8px;
    cursor:pointer;font-size:15px;color:#4b5b70;
    display:flex;align-items:center;justify-content:center;
  }
  .cal-nav button:hover{background:#eef3fa;}
  .cal-title{font-size:14px;font-weight:600;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-head{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;}
  .cal-cell{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:8px;font-size:12px;cursor:pointer;
    background:#f5f7fa;color:#c8d1dc;position:relative;transition:.15s;
  }
  .cal-cell.has-data{color:#41506a;font-weight:600;}
  .cal-cell.today{box-shadow:inset 0 0 0 2px #5b8def;}
  .cal-cell.viewing{box-shadow:inset 0 0 0 2px #e8833a;}
  .cal-cell.empty{background:transparent;cursor:default;}
  .cal-cell:not(.empty):hover{transform:scale(1.06);}
  .cal-cell:not(.empty):active{transform:scale(.96);}
  .cal-legend{
    display:flex;gap:12px;margin-top:12px;font-size:11px;color:var(--muted);
    flex-wrap:wrap;align-items:center;
  }
  .cal-legend .box{
    width:12px;height:12px;border-radius:3px;display:inline-block;
    vertical-align:-2px;margin-right:3px;
  }

  /* 设置 */
  .toggle-btn{
    font-size:12px;color:#5b8def;cursor:pointer;user-select:none;
    padding:5px 12px;border-radius:20px;background:#eef4ff;
  }
  .toggle-btn:hover{background:#dfeaff;}
  .settings-body{display:none;}
  .settings-body.open{display:block;}

  .setting-row{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line);
  }
  .setting-row label{font-size:13px;color:var(--muted);}
  .setting-row input[type="date"]{
    height:36px;padding:0 10px;font-size:13px;
    border:1px solid var(--line);border-radius:9px;
    background:#fafcfe;color:var(--text);font-family:inherit;
  }
  .setting-row input[type="date"]:focus{outline:none;border-color:#8fb0e0;box-shadow:0 0 0 3px rgba(91,141,239,.1);}

  .phase-setting{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  .phase-header{
    display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;
    background:#fafcfe;transition:.15s;
  }
  .phase-header:hover{background:#f5f9ff;}
  .phase-arrow{font-size:10px;color:var(--muted);transition:transform .2s;display:inline-block;}
  .phase-setting.open .phase-arrow{transform:rotate(90deg);}
  .phase-name{font-size:13px;font-weight:600;color:#41506a;}
  .phase-range{font-size:11px;color:var(--muted);margin-left:auto;}
  .phase-body{display:none;padding:14px;border-top:1px solid var(--line);background:#fff;}
  .phase-setting.open .phase-body{display:block;}

  .phase-dates{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
  .phase-dates label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .phase-dates input[type="date"]{
    height:32px;padding:0 8px;font-size:12px;border:1px solid var(--line);
    border-radius:8px;background:#fafcfe;color:var(--text);font-family:inherit;
  }
  .phase-dates input[type="date"]:focus{outline:none;border-color:#8fb0e0;}

  .goal-table-wrap{
    overflow-x:auto;-webkit-overflow-scrolling:touch;
    border:1px solid var(--line);border-radius:10px;background:#fcfdfe;padding:4px 2px;margin-bottom:4px;
  }
  .goal-table{width:100%;border-collapse:collapse;font-size:13px;min-width:700px;}
  .goal-table thead th{
    font-size:11px;color:var(--muted);font-weight:500;
    padding:6px 2px;text-align:center;background:#f5f8fc;
  }
  .goal-table thead th:first-child{text-align:left;padding-left:8px;background:#f5f8fc;}
  .goal-table td{padding:3px 2px;text-align:center;}
  .goal-table td:first-child{
    text-align:left;font-size:12px;color:#5a6b85;
    white-space:nowrap;padding-left:8px;min-width:100px;
  }
  .goal-table input{
    width:100%;max-width:60px;height:30px;text-align:center;
    font-size:12px;font-weight:600;border:1px solid var(--line);
    border-radius:7px;background:#fff;color:var(--text);
    font-variant-numeric:tabular-nums;-moz-appearance:textfield;
    font-family:inherit;
  }
  .goal-table input::-webkit-outer-spin-button,
  .goal-table input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .goal-table input:focus{outline:none;border-color:#8fb0e0;box-shadow:0 0 0 3px rgba(91,141,239,.1);}
  .goal-table tr.group-row td{
    padding-top:10px;padding-bottom:4px;font-weight:600;color:#41506a;font-size:12px;
    border-top:1px dashed var(--line);
  }
  .goal-table tr:first-child.group-row td,
  .goal-table tr.group-row:first-child td{border-top:none;padding-top:4px;}
  .goal-table .row-sum{
    font-size:11px;color:#b0bbc9;
    font-variant-numeric:tabular-nums;padding-left:6px;font-weight:400;
  }
  .goal-table td.day-sum{
    background:#fafcfe;font-size:11px;color:#8b95a5;font-weight:600;font-variant-numeric:tabular-nums;
  }
  .goal-table .subj-dot{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    margin-right:5px;vertical-align:1px;
  }
  .goal-summary{
    margin-top:12px;font-size:12px;color:var(--muted);
    padding-top:10px;border-top:1px dashed var(--line);line-height:1.8;
  }
  .goal-summary b{color:#41506a;font-weight:600;font-variant-numeric:tabular-nums;}
  .goal-summary .subj-line{display:flex;flex-wrap:wrap;gap:14px;margin-top:4px;}
  .goal-summary .subj-line span{display:inline-flex;align-items:center;gap:5px;}
  .reset-defaults{
    margin-top:6px;background:transparent;border:1px solid #dbe3ed;color:#8b95a5;
    padding:9px 16px;border-radius:10px;font-size:12px;cursor:pointer;
    font-family:inherit;transition:.15s;
  }
  .reset-defaults:hover{border-color:#c9576e;color:#c9576e;}

  /* 底部 */
  .footer{text-align:center;padding:8px 0 20px;}
  .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;}
  .fbtn{
    background:transparent;border:1px solid #dbe3ed;color:#8b95a5;
    padding:9px 18px;border-radius:10px;font-size:13px;cursor:pointer;
    transition:.15s;font-family:inherit;
  }
  .fbtn:hover{border-color:#5b8def;color:#5b8def;}
  .fbtn.danger:hover{border-color:#c9576e;color:#c9576e;}
  .footer p{font-size:12px;color:#a8b2c0;line-height:1.7;}

  /* 全屏计时器 */
  .timer-overlay{
    position:fixed;inset:0;z-index:1000;height:100vh;height:100dvh;
    background:linear-gradient(160deg,#1a2440 0%,#2b3f6b 100%);
    display:none;align-items:center;justify-content:center;color:#fff;
    padding:20px;
    padding-top:calc(20px + env(safe-area-inset-top));
    padding-bottom:calc(20px + env(safe-area-inset-bottom));
    animation:fadeIn .25s ease;overflow-y:auto;
  }
  .timer-overlay.open{display:flex;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  .timer-content{
    width:100%;max-width:480px;text-align:center;
    display:flex;flex-direction:column;align-items:center;
  }
  .timer-setup{width:100%;}
  .timer-setup-subject{
    display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px;
  }
  .timer-setup-subject .dot{width:12px;height:12px;border-radius:50%;}
  .timer-setup-subject .name{font-size:20px;font-weight:600;letter-spacing:.5px;}
  .timer-setup-label{font-size:13px;opacity:.6;margin-bottom:14px;letter-spacing:1px;}
  .timer-presets{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:24px;}
  .timer-preset{
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);
    color:#fff;font-family:inherit;padding:12px 20px;border-radius:12px;
    font-size:14px;cursor:pointer;transition:.15s;
    font-variant-numeric:tabular-nums;min-height:44px;
  }
  .timer-preset:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);}
  .timer-preset:active{transform:scale(.96);background:rgba(255,255,255,.25);}
  .timer-custom{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:30px;}
  .timer-custom input{
    width:88px;height:46px;text-align:center;background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.25);border-radius:10px;color:#fff;
    font-size:17px;font-weight:600;font-family:inherit;font-variant-numeric:tabular-nums;
    -moz-appearance:textfield;
  }
  .timer-custom input::-webkit-outer-spin-button,
  .timer-custom input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .timer-custom input:focus{outline:none;border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.15);}
  .timer-custom .unit{font-size:14px;opacity:.65;}
  .timer-big-btn{
    width:100%;height:54px;border-radius:14px;border:none;font-family:inherit;
    background:linear-gradient(135deg,#5b8def,#3d5a99);color:#fff;
    font-size:16px;font-weight:600;letter-spacing:1px;cursor:pointer;transition:.15s;
    box-shadow:0 6px 20px rgba(91,141,239,.35);
  }
  .timer-big-btn:hover{filter:brightness(1.1);}
  .timer-big-btn:active{transform:scale(.98);}
  .timer-cancel{
    margin-top:16px;background:transparent;border:none;color:rgba(255,255,255,.5);
    font-size:13px;cursor:pointer;font-family:inherit;letter-spacing:.5px;padding:8px 16px;
  }
  .timer-cancel:hover{color:rgba(255,255,255,.85);}

  .timer-running{display:flex;flex-direction:column;align-items:center;width:100%;}
  .timer-running-subject{display:flex;align-items:center;gap:10px;margin-bottom:24px;}
  .timer-running-subject .dot{width:10px;height:10px;border-radius:50%;}
  .timer-running-subject .name{font-size:17px;font-weight:500;opacity:.9;}

  .timer-circle{position:relative;width:min(280px,72vw);aspect-ratio:1;margin-bottom:32px;}
  .timer-circle svg{width:100%;height:100%;transform:rotate(-90deg);}
  .timer-circle .circle-bg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:10;}
  .timer-circle .circle-fg{
    fill:none;stroke:#5b8def;stroke-width:10;stroke-linecap:round;
    transition:stroke-dashoffset .3s linear, stroke .3s;
  }
  .timer-circle.warn .circle-fg{stroke:#e8833a;}
  .timer-circle.critical .circle-fg{stroke:#e85d75;}
  .timer-time{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:clamp(44px,14vw,64px);font-weight:700;
    font-variant-numeric:tabular-nums;letter-spacing:1px;
    text-shadow:0 2px 20px rgba(0,0,0,.3);
  }
  .timer-time.paused{opacity:.5;}
  .timer-status{font-size:12px;opacity:.55;margin-bottom:24px;letter-spacing:2px;}
  .timer-status .paused-tag{display:none;color:#f0b366;opacity:1;font-weight:600;}
  .timer-status.is-paused .paused-tag{display:inline;}

  .timer-actions{display:flex;gap:12px;width:100%;max-width:360px;}
  .timer-act{
    flex:1;height:52px;border-radius:13px;border:1px solid rgba(255,255,255,.22);

const SUB_IDS = [];
const SUB_META = {};
SUBJECT_TREE.forEach(g => g.children.forEach(c => {
  SUB_IDS.push(c.id);
  SUB_META[c.id] = { ...c, groupId:g.id, groupName:g.name, groupColor:g.color };

const DAY_KEYS   = ['mon','tue','wed','thu','fri','sat','sun'];
const DAY_LABELS = ['周一','周二','周三','周四','周五','周六','周日'];

const DOW_TO_KEY = ['sun','mon','tue','wed','thu','fri','sat'];

function buildDaily(map){
  const out = {};
  DAY_KEYS.forEach(k => out[k] = {});
  Object.keys(map).forEach(k => { out[k] = { ...map[k] }; });
  return out;
}

/* 全部时间单位 = 分钟 */

    start:'2027-07-01', end:'2027-08-31',
    daily: buildDaily({

      tue:{gaoshu:90,xiandai:45,gailv:45,ds:45,zucheng:45,os:45,net:45,en:60,pol:60},

/* 里程碑：分钟 */
const MILESTONES = [

const STORE_KEY  = 'kaoyan_2028_v7';
const LEGACY_KEYS = ['kaoyan_2028_v6','kaoyan_2028_v5','kaoyan_2028_v4','kaoyan_2028_v3','kaoyan_2028_v2'];

/* =========================================================
   二、状态
   ========================================================= */
let state = loadState();
let viewDateKey = null;
let calYear, calMonth;

function cloneDefaults(){
  return {
    records:{},
    examDate:DEFAULT_EXAM,
    phases:JSON.parse(JSON.stringify(DEFAULT_PHASES)),
    settingsOpen:false
  };
}

/* 迁移 v6 → v7：小时值 × 60 变成分钟；其它旧版本同理 */
function hoursToMin(v){
  return Math.max(0, Math.round(v * 60));
}

function migrateRecord(rec){
  if(!rec) return rec;
  const out = { ...rec };
  // 兼容 v3 那种 math/cs408 结构，先拆分到子科目
  if(typeof out.math === 'number'){
    out.gaoshu  = (out.gaoshu  ||0) + out.math*0.5;
    out.xiandai = (out.xiandai ||0) + out.math*0.25;
    out.gailv   = (out.gailv   ||0) + out.math*0.25;
    delete out.math;
  }
  if(typeof out.cs408 === 'number'){
    out.ds      = (out.ds      ||0) + out.cs408*0.3;
    out.zucheng = (out.zucheng ||0) + out.cs408*0.3;
    out.os      = (out.os      ||0) + out.cs408*0.2;
    out.net     = (out.net     ||0) + out.cs408*0.2;
    delete out.cs408;
  }
  if(typeof out.english === 'number'){ out.en = (out.en||0) + out.english; delete out.english; }
  if(typeof out.politics === 'number'){ out.pol = (out.pol||0) + out.politics; delete out.politics; }

  // 判断当前值是小数值（小时）还是整数值（分钟）
  // 若所有值都是整数且任一值 >= 5，视为分钟；否则视为小时
  const vals = SUB_IDS.map(id => out[id]).filter(v => typeof v === 'number');
  if(vals.length === 0) return out;

  const allInt = vals.every(v => Number.isInteger(v));
  const anyBig = vals.some(v => v >= 5);

  if(!allInt || !anyBig){
    // 视为小时 → × 60
    SUB_IDS.forEach(id => {
      if(typeof out[id] === 'number') out[id] = hoursToMin(out[id]);
    });
  }
  return out;
}

function migratePhase(p){
  if(!p.daily) p.daily = {};
  const hasOld = p.daily.weekday || p.daily.sat || p.daily.sun;
  const hasNew = DAY_KEYS.some(k => p.daily[k] !== undefined);
  if(hasOld && !hasNew){
    const old = p.daily;
    const wd = old.weekday || {}, sat = old.sat || {}, sun = old.sun || {};
    const nd = {};
    ['mon','tue','wed','thu','fri'].forEach(k => nd[k] = { ...wd });
    nd.sat = { ...sat };
    nd.sun = { ...sun };
    p.daily = nd;
  }
  // 判断是小数值（小时）还是整数值（分钟）
  const sample = [];
  DAY_KEYS.forEach(k => {
    if(!p.daily[k]) p.daily[k] = {};
    SUB_IDS.forEach(id => {
      const v = p.daily[k][id];
      if(typeof v === 'number') sample.push(v);
    });
  });
  const allInt = sample.every(v => Number.isInteger(v));
  const anyBig = sample.some(v => v >= 5);
  if(!allInt || !anyBig){
    DAY_KEYS.forEach(k => {
      SUB_IDS.forEach(id => {
        const v = p.daily[k][id];
        if(typeof v === 'number') p.daily[k][id] = hoursToMin(v);
      });
    });
  }
  // 补齐字段
  DAY_KEYS.forEach(k => {
    if(!p.daily[k]) p.daily[k] = {};
    SUB_IDS.forEach(id => {
      if(typeof p.daily[k][id] !== 'number') p.daily[k][id] = 0;
    });
  });
  return p;
}

function loadState(){
  let raw = localStorage.getItem(STORE_KEY);
  if(!raw){
    for(const k of LEGACY_KEYS){
      const v = localStorage.getItem(k);
      if(v){ raw = v; break; }
    }
  }
  if(raw){
    try{
      const s = JSON.parse(raw);
      if(!s.records) s.records = {};
      for(const k in s.records) s.records[k] = migrateRecord(s.records[k]);
      if(!s.examDate) s.examDate = DEFAULT_EXAM;
      if(!Array.isArray(s.phases) || s.phases.length===0){
        s.phases = JSON.parse(JSON.stringify(DEFAULT_PHASES));
      } else {
        s.phases = s.phases.map(migratePhase);
      }
      if(typeof s.settingsOpen !== 'boolean') s.settingsOpen = false;
      return s;
    }catch(e){}
  }
  return cloneDefaults();
}

function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

/* =========================================================
   三、工具（全程分钟）
   ========================================================= */
function startOfDay(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function fmtDate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseDate(key){
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y,m-1,d);
}
function getWeekRange(date){
  const d = startOfDay(date);
  const diff = d.getDay()===0 ? -6 : 1-d.getDay();
  const monday = new Date(d); monday.setDate(d.getDate()+diff);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  return [monday,sunday];
}
function getRecord(key){ return state.records[key] || {}; }

/* 存的是分钟（整数） */
function setRecordValue(key, subId, minutes){
  if(!state.records[key]) state.records[key] = {};
  state.records[key][subId] = Math.max(0, Math.round(minutes));
  save();
}
function addRecordValue(key, subId, minutes){
  const cur = getRecord(key)[subId] || 0;
  setRecordValue(key, subId, cur + minutes);
}
function setNote(key, text){
  if(!state.records[key]) state.records[key] = {};
  state.records[key].note = text;
  save();
}
function getViewDate(){ return viewDateKey ? parseDate(viewDateKey) : new Date(); }
function isViewingToday(){
  return viewDateKey === null || viewDateKey === fmtDate(new Date());
}

function getPhase(date){
  const key = fmtDate(date);
  for(const p of state.phases){
    if(key >= p.start && key <= p.end) return p;
  }
  if(key < state.phases[0].start) return state.phases[0];
  return state.phases[state.phases.length-1];
}
function getDailyGoal(date){
  const phase = getPhase(date);
  const key = DOW_TO_KEY[date.getDay()];
  return (phase.daily && phase.daily[key]) || {};
}

/* ⭐ 分钟 → 显示（永不出现 0.15 这种小数） */
function fmtMin(min){
  min = Math.round(min || 0);
  if(min <= 0) return '0';
  if(min < 60) return min + '分';
  const h = Math.floor(min/60);
  const m = min % 60;
  return m === 0 ? h + '小时' : h + '小时' + m + '分';
}
/* 紧凑（周表） */
function fmtMinShort(min){
  min = Math.round(min || 0);
  if(min <= 0) return '0';
  if(min < 60) return min + 'm';
  const h = Math.floor(min/60);
  const m = min % 60;
  return m === 0 ? h + 'h' : h + 'h' + m;
}
/* 总时长显示成 Xh Ym */
function fmtTotal(min){
  min = Math.round(min || 0);
  if(min <= 0) return '0';
  const h = Math.floor(min/60);
  const m = min % 60;
  if(h === 0) return m + '分';
  if(m === 0) return h + '<small>h</small>';
  return h + '<small>h</small>' + m + '<small>m</small>';
}

/* 统计 */
function computeTotalMin(){
  let total = 0;
  for(const key in state.records){
    const rec = state.records[key];
    for(const id of SUB_IDS) total += rec[id] || 0;
  }
  return total;
}
function computeByGroup(){
  const out = {};
  SUBJECT_TREE.forEach(g => out[g.id] = 0);
  for(const key in state.records){
    const rec = state.records[key];
    SUBJECT_TREE.forEach(g => {
      g.children.forEach(c => { out[g.id] += rec[c.id] || 0; });
    });
  }
  return out;
}
function computeStudyDays(){
  let n = 0;
  for(const key in state.records){
    const rec = state.records[key];
    const total = SUB_IDS.reduce((s,id) => s + (rec[id]||0), 0);
    if(total > 0) n++;
  }
  return n;
}
function computeStreak(){
  let streak = 0;
  const today = startOfDay(new Date());
  let startIdx = 0;
  const todayRec = state.records[fmtDate(today)];
  const todayHas = todayRec && SUB_IDS.some(id => (todayRec[id]||0) > 0);
  if(!todayHas) startIdx = 1;
  for(let i=startIdx; i<3650; i++){
    const d = new Date(today); d.setDate(today.getDate()-i);
    const rec = state.records[fmtDate(d)];
    if(!rec) break;
    const total = SUB_IDS.reduce((s,id) => s + (rec[id]||0), 0);
    if(total > 0) streak++; else break;
  }
  return streak;
}
function dayCompletion(key){
  const date = parseDate(key);
  const goal = getDailyGoal(date);
  const rec = state.records[key] || {};
  let g = 0, a = 0;
  for(const id of SUB_IDS){ g += goal[id]||0; a += rec[id]||0; }
  if(g === 0) return null;
  return a / g;
}

let toastTimer = null;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* =========================================================
   四、渲染
   ========================================================= */
function renderCountdown(){
  const exam = new Date(state.examDate + 'T00:00:00');
  const today0 = startOfDay(new Date());
  const days = Math.max(0, Math.round((exam - today0) / 86400000));
  document.getElementById('cdDays').textContent = days;
  document.getElementById('cdWeeks').textContent = Math.floor(days/7);
  document.getElementById('examDateText').textContent = state.examDate;

  const phase = getPhase(new Date());
  document.getElementById('cdPhase').textContent = '当前：' + phase.name;

  const start = parseDate(phase.start);
  const end = parseDate(phase.end);
  const total = (end - start) / 86400000;
  const passed = Math.max(0, (today0 - start) / 86400000);
  const pct = Math.max(0, Math.min(100, (passed/total)*100));
  document.getElementById('phaseBar').style.width = pct + '%';
  document.getElementById('phaseTip').textContent =
    `${phase.name} 进度 ${pct.toFixed(0)}% · ${phase.start} → ${phase.end}`;
}

function renderToday(){
  const d = getViewDate();
  const key = fmtDate(d);
  const dow = d.getDay();
  const goal = getDailyGoal(d);
  const rec = getRecord(key);

  document.getElementById('todayChip').textContent =
    `${d.getMonth()+1}月${d.getDate()}日 ${DAY_LABELS[(dow+6)%7]}`;

  const tip = document.getElementById('viewingTip');
  const back = document.getElementById('backToday');
  if(!isViewingToday()){
    tip.textContent = `正在查看 ${key} 的记录，点击科目可继续计时`;
    tip.style.display = 'block';
    back.style.display = 'inline';
  } else {
    tip.style.display = 'none';
    back.style.display = 'none';
  }

  let html = '';
  let hasAny = false;

  SUBJECT_TREE.forEach(group => {
    const visible = group.children.filter(c => (goal[c.id]||0) > 0 || (rec[c.id]||0) > 0);
    if(visible.length === 0) return;
    hasAny = true;

    const groupGoal = visible.reduce((s,c) => s + (goal[c.id]||0), 0);
    const groupDone = visible.reduce((s,c) => s + (rec[c.id]||0), 0);

    html += `<div class="group-title">
      <span style="background:${group.color};width:9px;height:9px;border-radius:50%;"></span>
      <span>${group.name}</span>
      <span class="group-total">${fmtMin(groupDone)} / ${fmtMin(groupGoal)}</span>
    </div>`;

    visible.forEach(c => {
      const g = goal[c.id] || 0;
      const v = rec[c.id] || 0;
      const pct = g > 0 ? Math.min(100, (v/g)*100) : 100;
      const done = g > 0 && v >= g;
      const isExtra = g === 0 && v > 0;

      html += `<div class="sub-task ${done?'is-done':''} ${isExtra?'is-extra':''}"
                    data-subject="${c.id}" title="点击开始计时">
        <span style="background:${c.color};width:8px;height:8px;border-radius:50%;"></span>
        <span class="sub-name">${c.name}</span>
        <span class="sub-progress">
          <b>${fmtMin(v)}</b><span class="goal"> / ${fmtMin(g)}</span>
        </span>
        <span class="bar"><span class="bar-fill" style="width:${pct}%;background:${c.color}"></span></span>
        <span class="start-icon">▶ 计时</span>
      </div>`;
    });
  });

  if(!hasAny){
    html = '<p class="empty">今天没有硬性任务，点击下方科目可以自由计时。</p>';
  }

  const extraIds = SUB_IDS.filter(id => (goal[id]||0) === 0 && (rec[id]||0) === 0);
  if(extraIds.length > 0){
    html += `<div style="margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);">
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">额外学习（无预设目标）</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">`;
    extraIds.forEach(id => {
      const meta = SUB_META[id];
      html += `<button class="extra-btn" data-subject="${id}"
        style="display:inline-flex;align-items:center;gap:5px;
          background:#f5f7fa;border:1px solid var(--line);
          padding:6px 12px;border-radius:9px;font-size:12px;
          color:#6b7a90;cursor:pointer;font-family:inherit;transition:.15s;"
        ><span style="width:6px;height:6px;border-radius:50%;background:${meta.color};"></span>${meta.name}</button>`;
    });
    html += `</div></div>`;
  }

  document.getElementById('tasks').innerHTML = html;
  document.getElementById('noteInput').value = rec.note || '';
  renderTodaySummary();
}

function renderTodaySummary(){
  const d = getViewDate();
  const goal = getDailyGoal(d);
  const rec = getRecord(fmtDate(d));

  let totalGoal = 0, totalDone = 0;
  for(const id of SUB_IDS){
    totalGoal += goal[id] || 0;
    totalDone += rec[id] || 0;
  }
  const remain = Math.max(0, totalGoal - totalDone);
  const el = document.getElementById('todaySummary');
  const done = totalGoal > 0 && totalDone >= totalGoal;
  el.classList.toggle('done', done);

  if(totalGoal === 0){
    el.innerHTML = `<span class="ts-main">今日已完成 <b>${fmtMin(totalDone)}</b>（无预设目标）</span>`;
    return;
  }
  el.innerHTML = `
    <span class="ts-main">今日完成 <b>${fmtMin(totalDone)}</b> / ${fmtMin(totalGoal)}</span>
    <span class="ts-remain">${done ? '✓ 目标已达成' : '还需 ' + fmtMin(remain)}</span>
  `;
}

function computeCarry(date){
  const carry = {};
  SUB_IDS.forEach(id => carry[id] = 0);
  const [monday] = getWeekRange(date);
  const today0 = startOfDay(new Date());
  for(let i=0; i<5; i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    if(d.getTime() >= today0.getTime()) break;
    const goal = getDailyGoal(d);
    const rec = getRecord(fmtDate(d));
    for(const id of SUB_IDS){
      const g = goal[id] || 0;
      const v = rec[id] || 0;
      if(g > v) carry[id] += (g - v);
    }
  }
  return carry;
}

function renderCarry(){
  const carry = computeCarry(getViewDate());
  const el = document.getElementById('carryList');
  let any = false;
  let html = '';

  SUBJECT_TREE.forEach(group => {
    const items = group.children.filter(c => carry[c.id] > 0);
    if(items.length === 0) return;
    any = true;
    html += `<div class="carry-group">
      <div class="carry-group-title">
        <span style="width:7px;height:7px;border-radius:50%;background:${group.color};"></span>
        ${group.name}
      </div>
      <div class="carry-items">`;
    items.forEach(c => {
      html += `<div class="carry-item">
        <span class="carry-name">${c.name}</span>
        <span class="carry-val">${fmtMin(carry[c.id])}</span>
      </div>`;
    });
    html += `</div></div>`;
  });

  if(!any){
    el.innerHTML = '<p class="empty ok">✓ 本周暂无待补任务，保持住。</p>';
    return;
  }
  const totalRemain = SUB_IDS.reduce((s,id) => s + carry[id], 0);
  html += `<p class="carry-tip">合计需补 <b>${fmtMin(totalRemain)}</b>，建议安排在周六或周日的机动时间。<br>
           每周日 24:00 结算，未补完的部分不累积到下一周。</p>`;
  el.innerHTML = html;
}

function renderWeekTable(){
  const [monday, sunday] = getWeekRange(getViewDate());
  document.getElementById('weekRange').textContent =
    `${monday.getMonth()+1}/${monday.getDate()} - ${sunday.getMonth()+1}/${sunday.getDate()}`;
  const todayKey = fmtDate(new Date());
  const today0 = startOfDay(new Date()).getTime();

  let html = '<table class="week-table"><thead><tr>'
    + '<th>日期</th>'
    + SUBJECT_TREE.map(g => `<th>${g.name}</th>`).join('')
    + '<th>合计</th></tr></thead><tbody>';

  for(let i=0; i<7; i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    const key = fmtDate(d);
    const dow = d.getDay();
    const goal = getDailyGoal(d);
    const rec = getRecord(key);
    const isToday = key === todayKey;
    const isFuture = d.getTime() > today0;

    let cells = '';
    let sumA = 0, sumG = 0;

    SUBJECT_TREE.forEach(g => {
      let gA = 0, gG = 0;
      g.children.forEach(c => {
        gA += rec[c.id] || 0;
        gG += goal[c.id] || 0;
      });
      sumA += gA; sumG += gG;
      if(gG === 0 && gA === 0){ cells += '<td class="na">—</td>'; return; }

      let cls = 'miss';
      if(gA >= gG && gG > 0) cls = 'ok';
      else if(gA > 0) cls = 'part';
      if(isFuture) cls = 'na';

      cells += `<td class="${cls}">${fmtMinShort(gA)}<span class="sl">/${fmtMinShort(gG)}</span></td>`;
    });

    html += `<tr class="${isToday?'today-row':''}">
      <td class="day-cell" data-date="${key}">${DAY_LABELS[(dow+6)%7]}<span class="dnum">${d.getMonth()+1}/${d.getDate()}</span></td>
      ${cells}
      <td class="sum">${fmtMinShort(sumA)}<span class="sl">/${fmtMinShort(sumG)}</span></td>
    </tr>`;
  }
  html += '</tbody></table>';
  document.getElementById('weekTable').innerHTML = html;
}

function renderStats(){
  const totalMin = computeTotalMin();
  const streak = computeStreak();
  const days = computeStudyDays();
  const avg = days > 0 ? totalMin / days : 0;
  const byGroup = computeByGroup();

  document.getElementById('statTotal').innerHTML = fmtTotal(totalMin);
  document.getElementById('statStreak').innerHTML = streak + '<small>天</small>';
  document.getElementById('statDays').innerHTML = days + '<small>天</small>';
  document.getElementById('statAvg').innerHTML = fmtTotal(avg);

  let subjHtml = '';
  SUBJECT_TREE.forEach(g => {
    subjHtml += `<div class="subj-stat">
      <span style="width:8px;height:8px;border-radius:50%;background:${g.color};"></span>
      <span>${g.name}</span>
      <span class="val">${fmtTotal(byGroup[g.id])}</span>
    </div>`;
  });
  document.getElementById('subjectStats').innerHTML = subjHtml;

  const statData = { totalMin, streak, days };
  let msHtml = '';
  MILESTONES.forEach(m => {
    const achieved = m.check(statData);
    msHtml += `<div class="milestone ${achieved?'achieved':''}">
      <span class="icon">${m.icon}</span><span>${m.label}</span>
    </div>`;
  });
  document.getElementById('milestones').innerHTML = msHtml;
}

function renderCalendar(){
  const today = new Date();
  if(calYear === undefined){ calYear = today.getFullYear(); calMonth = today.getMonth(); }
  document.getElementById('calTitle').textContent = `${calYear}年${calMonth+1}月`;

  document.getElementById('calHead').innerHTML =
    DAY_SHORT.map(h => `<div class="cal-head">${h}</div>`).join('');

  const first = new Date(calYear, calMonth, 1);
  const startOffset = (first.getDay()+6) % 7;
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const todayKey = fmtDate(today);

  let html = '';
  for(let i=0; i<startOffset; i++) html += '<div class="cal-cell empty"></div>';
  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(calYear, calMonth, day);
    const key = fmtDate(d);
    const pct = dayCompletion(key);

    let bg = '#f5f7fa', hasData = false;
    if(pct !== null && pct > 0){
      hasData = true;
      if(pct < 0.3) bg = '#fbdcc8';
      else if(pct < 0.6) bg = '#fce4a8';
      else if(pct < 0.9) bg = '#d4ecc4';
      else bg = '#a8e0b8';
    }
    const cls = ['cal-cell', hasData?'has-data':'',
      key===todayKey?'today':'',
      key===viewDateKey?'viewing':''].filter(Boolean).join(' ');

    html += `<div class="${cls}" style="background:${bg}" data-date="${key}">${day}</div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}

function renderAll(){
  renderCountdown();
  renderToday();
  renderCarry();
  renderWeekTable();
  renderStats();
  renderCalendar();
}

/* =========================================================
   五、全屏计时器（分钟精度）
   ========================================================= */
const timer = {
  subjectId:null,
  totalSeconds:0,
  accumulatedMs:0,
  segmentStart:null,
  intervalId:null,
  phase:'setup'
};

function getElapsedMs(){
  if(timer.segmentStart !== null) return timer.accumulatedMs + (Date.now() - timer.segmentStart);
  return timer.accumulatedMs;
}

function openTimer(subjectId){
  timer.subjectId = subjectId;
  timer.phase = 'setup';
  timer.totalSeconds = 0;
  timer.accumulatedMs = 0;
  timer.segmentStart = null;
  if(timer.intervalId){ clearInterval(timer.intervalId); timer.intervalId = null; }
  document.getElementById('timerOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderTimer();
}

function closeTimer(){
  if(timer.intervalId){ clearInterval(timer.intervalId); timer.intervalId = null; }
  document.getElementById('timerOverlay').classList.remove('open');
  document.body.style.overflow = '';
  timer.subjectId = null;
  timer.segmentStart = null;
  timer.accumulatedMs = 0;
  renderAll();
}

function renderTimer(){
  const content = document.getElementById('timerContent');
  const meta = SUB_META[timer.subjectId];
  if(!meta){ closeTimer(); return; }

  if(timer.phase === 'setup'){
    content.innerHTML = `
      <div class="timer-setup">
        <div class="timer-setup-subject">
          <span class="dot" style="background:${meta.color};"></span>
          <span class="name">${meta.name}</span>
        </div>
        <div class="timer-setup-label">选择本次专注时长</div>
        <div class="timer-presets">
          <button class="timer-preset" data-min="15">15 分钟</button>
          <button class="timer-preset" data-min="25">25 分钟</button>
          <button class="timer-preset" data-min="45">45 分钟</button>
          <button class="timer-preset" data-min="60">60 分钟</button>
          <button class="timer-preset" data-min="90">90 分钟</button>
        </div>
        <div class="timer-custom">
          <input type="number" id="timerCustomMin" min="1" max="360" value="45" step="5" inputmode="numeric">
          <span class="unit">分钟</span>
        </div>
        <button class="timer-big-btn" id="timerStartBtn">开始专注</button>
        <button class="timer-cancel" id="timerCancelBtn">取消</button>
      </div>`;
    const inp = document.getElementById('timerCustomMin');
    if(inp){ inp.focus(); inp.select(); }
  } else if(timer.phase === 'running'){
    const remain = Math.max(0, timer.totalSeconds*1000 - getElapsedMs());
    const totalSec = timer.totalSeconds;
    const remainSec = Math.ceil(remain/1000);
    const elapsedSec = totalSec - remainSec;
    const pct = totalSec > 0 ? elapsedSec / totalSec : 0;

    const mm = String(Math.floor(remainSec/60)).padStart(2,'0');
    const ss = String(remainSec%60).padStart(2,'0');

    const R = 88;
    const C = 2 * Math.PI * R;
    const offset = C * (1 - pct);
    const circleCls = pct >= 0.8 ? 'critical' : (pct >= 0.5 ? 'warn' : '');
    const isPaused = timer.segmentStart === null;

    content.innerHTML = `
      <div class="timer-running">
        <div class="timer-running-subject">
          <span class="dot" style="background:${meta.color};"></span>
          <span class="name">${meta.name}</span>
        </div>
        <div class="timer-circle ${circleCls}">
          <svg viewBox="0 0 200 200">
            <circle class="circle-bg" cx="100" cy="100" r="${R}"></circle>
            <circle class="circle-fg" cx="100" cy="100" r="${R}"
              stroke-dasharray="${C.toFixed(2)}"
              stroke-dashoffset="${offset.toFixed(2)}"></circle>
          </svg>
          <div class="timer-time ${isPaused?'paused':''}" id="timerTime">${mm}:${ss}</div>
        </div>
        <div class="timer-status ${isPaused?'is-paused':''}" id="timerStatus">
          ${isPaused ? '<span class="paused-tag">已暂停</span>' : '专注中'}
        </div>
        <div class="timer-actions">
          <button class="timer-act ${isPaused?'primary':''}" id="timerPauseBtn">
            ${isPaused ? '继续' : '暂停'}
          </button>
          <button class="timer-act danger" id="timerEndBtn">结束</button>
        </div>
      </div>`;
  } else if(timer.phase === 'done'){
    const elapsedMin = Math.round(timer.accumulatedMs / 60000);
    content.innerHTML = `
      <div class="timer-done">
        <div class="timer-done-icon">🎉</div>
        <div class="timer-done-title">专注完成</div>
        <div class="timer-done-sub">${meta.name}</div>
        <div class="timer-done-time">+${fmtMin(elapsedMin)}</div>
        <button class="timer-big-btn" id="timerDoneBtn">返回</button>
      </div>`;
  }
}

function tickTimer(){
  if(timer.phase !== 'running') return;
  const elapsed = getElapsedMs();
  const remain = timer.totalSeconds*1000 - elapsed;

  if(remain <= 0){
    timer.accumulatedMs = timer.totalSeconds*1000;
    timer.segmentStart = null;
    finishTimer();
    return;
  }

  const totalSec = timer.totalSeconds;
  const remainSec = Math.ceil(remain/1000);
  const elapsedSec = totalSec - remainSec;
  const pct = totalSec > 0 ? elapsedSec / totalSec : 0;

  const mm = String(Math.floor(remainSec/60)).padStart(2,'0');
  const ss = String(remainSec%60).padStart(2,'0');
  const timeEl = document.getElementById('timerTime');
  if(timeEl) timeEl.textContent = `${mm}:${ss}`;

  const circleEl = document.querySelector('.timer-circle');
  const fgEl = document.querySelector('.timer-circle .circle-fg');
  if(circleEl && fgEl){
    const R = 88;
    const C = 2 * Math.PI * R;
    fgEl.setAttribute('stroke-dashoffset', (C * (1 - pct)).toFixed(2));
    circleEl.classList.toggle('warn', pct >= 0.5 && pct < 0.8);
    circleEl.classList.toggle('critical', pct >= 0.8);
  }
}

function startTimerRun(seconds){
  timer.phase = 'running';
  timer.totalSeconds = seconds;
  timer.accumulatedMs = 0;
  timer.segmentStart = Date.now();
  renderTimer();
  if(timer.intervalId) clearInterval(timer.intervalId);
  timer.intervalId = setInterval(tickTimer, 200);
}

function finishTimer(){
  if(timer.intervalId){ clearInterval(timer.intervalId); timer.intervalId = null; }
  const key = viewDateKey || fmtDate(new Date());
  // ⭐ 精确到分钟：四舍五入到整分钟
  const minutes = Math.round(timer.accumulatedMs / 60000);
  if(minutes > 0) addRecordValue(key, timer.subjectId, minutes);

  timer.phase = 'done';
  renderTimer();
  setTimeout(() => { if(timer.phase === 'done') closeTimer(); }, 1800);
}

document.getElementById('timerOverlay').addEventListener('click', (e) => {
  const el = e.target;
  const preset = el.closest('.timer-preset');
  if(preset){ startTimerRun(parseInt(preset.dataset.min) * 60); return; }

  if(el.id === 'timerStartBtn'){
    const input = document.getElementById('timerCustomMin');
    let min = parseInt(input.value);
    if(isNaN(min) || min <= 0) min = 45;
    if(min > 360) min = 360;
    startTimerRun(min * 60);
    return;
  }
  if(el.id === 'timerCancelBtn'){ closeTimer(); return; }
  if(el.id === 'timerPauseBtn'){
    if(timer.segmentStart === null) timer.segmentStart = Date.now();
    else {
      timer.accumulatedMs += Date.now() - timer.segmentStart;
      timer.segmentStart = null;
    }
    renderTimer();
    return;
  }
  if(el.id === 'timerEndBtn'){
    if(timer.segmentStart !== null){
      timer.accumulatedMs += Date.now() - timer.segmentStart;
      timer.segmentStart = null;
    }
    const remainMs = timer.totalSeconds*1000 - timer.accumulatedMs;
    if(remainMs > 1000){
      const remainMin = Math.ceil(remainMs/60000);
      if(!confirm(`还剩 ${remainMin} 分钟，确定要提前结束吗？`)){
        timer.segmentStart = Date.now();
        renderTimer();
        return;
      }
    }
    finishTimer();
    return;
  }
  if(el.id === 'timerDoneBtn'){ closeTimer(); return; }
});

document.getElementById('timerOverlay').addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && e.target.id === 'timerCustomMin'){
    e.preventDefault();
    const btn = document.getElementById('timerStartBtn');
    if(btn) btn.click();
  }
  if(e.key === 'Escape' && timer.phase === 'setup') closeTimer();
});

/* =========================================================
   六、设置面板（全部用分钟）
   ========================================================= */
function updateSettingsVisibility(){
  const body = document.getElementById('settingsBody');
  const btn = document.getElementById('toggleSettings');
  if(state.settingsOpen){
    body.classList.add('open');
    btn.textContent = '收起 ▴';
  } else {
    body.classList.remove('open');
    btn.textContent = '展开 ▾';
  }
}

function phaseSummary(pi){
  const p = state.phases[pi];
  const daySum = (k) => SUB_IDS.reduce((s,id) => s + ((p.daily[k] && p.daily[k][id]) || 0), 0);
  const weekTotal = DAY_KEYS.reduce((s,k) => s + daySum(k), 0);
  const avg = weekTotal / 7;

  const groupLines = SUBJECT_TREE.map(g => {
    const sum = g.children.reduce((s,c) =>
      s + DAY_KEYS.reduce((t,k) => t + ((p.daily[k] && p.daily[k][c.id]) || 0), 0), 0);
    return `<span><span class="subj-dot" style="background:${g.color};"></span>${g.name} <b>${fmtMin(sum)}</b>/周</span>`;
  }).join('');

  return `<div>每周 <b>${fmtMin(weekTotal)}</b> · 日均 <b>${fmtMin(avg)}</b></div>
          <div class="subj-line">${groupLines}</div>`;
}

function renderSettings(){
  let html = '';
  html += `<div class="setting-row">
    <label>初试日期</label>
    <input type="date" id="setExamDate" value="${state.examDate}">
    <span class="hint">修改后倒计时自动更新</span>
  </div>`;

  state.phases.forEach((p, pi) => {
    html += `<div class="phase-setting" data-phase="${pi}">
      <div class="phase-header">
        <span class="phase-arrow">▶</span>
        <span class="phase-name">${p.name}</span>
        <span class="phase-range">${p.start} ~ ${p.end}</span>
      </div>
      <div class="phase-body">
        <div class="phase-dates">
          <label>开始 <input type="date" data-act="set-start" data-phase="${pi}" value="${p.start}"></label>
          <label>结束 <input type="date" data-act="set-end" data-phase="${pi}" value="${p.end}"></label>
        </div>
        <div class="goal-table-wrap">
          <table class="goal-table">
            <thead>
              <tr>
                <th>科目（分钟）</th>
                ${DAY_LABELS.map(l => `<th>${l}</th>`).join('')}
                <th>周计</th>
              </tr>
            </thead>
            <tbody>
              ${SUBJECT_TREE.map(group => `
                <tr class="group-row">
                  <td><span class="subj-dot" style="background:${group.color};"></span>${group.name}</td>
                  <td colspan="8"></td>
                </tr>
                ${group.children.map(c => {
                  const rowSum = DAY_KEYS.reduce((s,k) => s + ((p.daily[k] && p.daily[k][c.id]) || 0), 0);
                  return `<tr>
                    <td><span class="subj-dot" style="background:${c.color};"></span>${c.name}</td>
                    ${DAY_KEYS.map(dk => {
                      const v = (p.daily[dk] && p.daily[dk][c.id]) || 0;
                      return `<td><input type="number" step="5" min="0" max="1440"
                        inputmode="numeric"
                        data-act="set-goal"
                        data-phase="${pi}"
                        data-daykey="${dk}"
                        data-subject="${c.id}"
                        value="${v}"></td>`;
                    }).join('')}
                    <td class="row-sum" data-rowsum="${pi}-${c.id}">${fmtMinShort(rowSum)}</td>
                  </tr>`;
                }).join('')}
              `).join('')}
              <tr class="group-row" style="border-top:1px dashed var(--line);">
                <td style="color:#8b95a5;font-weight:500;">每日合计</td>
                ${DAY_KEYS.map(dk => {
                  const sum = SUB_IDS.reduce((s,id) => s + ((p.daily[dk] && p.daily[dk][id]) || 0), 0);
                  return `<td class="day-sum" data-daysum="${pi}-${dk}">${fmtMinShort(sum)}</td>`;
                }).join('')}
                <td class="day-sum" data-weeksum="${pi}"></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="goal-summary" data-summary="${pi}">${phaseSummary(pi)}</div>
      </div>
    </div>`;
  });

  html += `<button class="reset-defaults" id="resetDefaults">恢复默认设置</button>`;
  document.getElementById('settingsBody').innerHTML = html;
  state.phases.forEach((p, pi) => updateWeekTotalCell(pi));
}

function updatePhaseSummary(pi){
  const el = document.querySelector(`.goal-summary[data-summary="${pi}"]`);
  if(el) el.innerHTML = phaseSummary(pi);
}
function updatePhaseRangeText(pi){
  const p = state.phases[pi];
  const el = document.querySelector(`.phase-setting[data-phase="${pi}"] .phase-range`);
  if(el) el.textContent = `${p.start} ~ ${p.end}`;
}
function updateRowSum(pi, subId){
  const p = state.phases[pi];
  const el = document.querySelector(`[data-rowsum="${pi}-${subId}"]`);
  if(!el) return;
  const sum = DAY_KEYS.reduce((s,k) => s + ((p.daily[k] && p.daily[k][subId]) || 0), 0);
  el.textContent = fmtMinShort(sum);
}
function updateDaySum(pi, dayKey){
  const p = state.phases[pi];
  const el = document.querySelector(`[data-daysum="${pi}-${dayKey}"]`);
  if(!el) return;
  const sum = SUB_IDS.reduce((s,id) => s + ((p.daily[dayKey] && p.daily[dayKey][id]) || 0), 0);
  el.textContent = fmtMinShort(sum);
}
function updateWeekTotalCell(pi){
  const p = state.phases[pi];
  const el = document.querySelector(`[data-weeksum="${pi}"]`);
  if(!el) return;
  const total = DAY_KEYS.reduce((s,k) => s + SUB_IDS.reduce((t,id) =>
    t + ((p.daily[k] && p.daily[k][id]) || 0), 0), 0);
  el.textContent = fmtMinShort(total);
}

/* =========================================================
   七、事件
   ========================================================= */
document.getElementById('toggleSettings').addEventListener('click', () => {
  state.settingsOpen = !state.settingsOpen;
  save();
  updateSettingsVisibility();
});

document.getElementById('settingsBody').addEventListener('click', (e) => {
  const header = e.target.closest('.phase-header');
  if(header){ header.closest('.phase-setting').classList.toggle('open'); return; }
  if(e.target.id === 'resetDefaults'){
    if(confirm('确定要恢复所有学习目标为默认设置吗？打卡记录不会丢失。')){
      state.phases = JSON.parse(JSON.stringify(DEFAULT_PHASES));
      state.examDate = DEFAULT_EXAM;
      save();
      renderSettings();
      renderAll();
    }
  }
});

document.getElementById('settingsBody').addEventListener('input', (e) => {
  const el = e.target;

  if(el.id === 'setExamDate'){
    if(/^\d{4}-\d{2}-\d{2}$/.test(el.value)){
      state.examDate = el.value; save(); renderCountdown();
    }
    return;
  }

  const act = el.dataset.act;
  if(!act) return;
  const pi = parseInt(el.dataset.phase);
  const p = state.phases[pi];
  if(!p) return;

  if(act === 'set-start' || act === 'set-end'){
    if(/^\d{4}-\d{2}-\d{2}$/.test(el.value)){
      if(act === 'set-start') p.start = el.value;
      else p.end = el.value;
      save();
      updatePhaseRangeText(pi);
      renderAll();
    }
    return;
  }

  if(act === 'set-goal'){
    const dayKey = el.dataset.daykey;
    const subj = el.dataset.subject;
    let v = parseInt(el.value);
    if(isNaN(v)) v = 0;
    v = Math.max(0, Math.min(1440, v));
    if(!p.daily[dayKey]) p.daily[dayKey] = {};
    p.daily[dayKey][subj] = v;
    save();
    updateRowSum(pi, subj);
    updateDaySum(pi, dayKey);
    updateWeekTotalCell(pi);
    updatePhaseSummary(pi);
    renderCountdown();
    renderToday();
    renderCarry();
    renderWeekTable();
    renderStats();
    renderCalendar();
  }
});

document.getElementById('settingsBody').addEventListener('blur', (e) => {
  const el = e.target;
  if(el.dataset && el.dataset.act === 'set-goal'){
    const pi = parseInt(el.dataset.phase);
    const dayKey = el.dataset.daykey;
    const subj = el.dataset.subject;
    const p = state.phases[pi];
    if(p && p.daily[dayKey]) el.value = p.daily[dayKey][subj] || 0;
  }
}, true);

document.getElementById('tasks').addEventListener('click', (e) => {
  const sub = e.target.closest('.sub-task');
  if(sub && sub.dataset.subject){ openTimer(sub.dataset.subject); return; }
  const extra = e.target.closest('.extra-btn');
  if(extra && extra.dataset.subject) openTimer(extra.dataset.subject);
});

document.getElementById('noteInput').addEventListener('input', (e) => {
  const key = viewDateKey || fmtDate(new Date());
  setNote(key, e.target.value);
});

document.getElementById('backToday').addEventListener('click', () => {
  viewDateKey = null;
  renderAll();
});

document.getElementById('weekTable').addEventListener('click', (e) => {
  const cell = e.target.closest('.day-cell');
  if(!cell) return;
  viewDateKey = cell.dataset.date;
  renderAll();
  document.getElementById('tasks').scrollIntoView({behavior:'smooth', block:'center'});
});

document.getElementById('calPrev').addEventListener('click', () => {
  calMonth--; if(calMonth < 0){ calMonth = 11; calYear--; }
  renderCalendar();
});
document.getElementById('calNext').addEventListener('click', () => {
  calMonth++; if(calMonth > 11){ calMonth = 0; calYear++; }
  renderCalendar();
});
document.getElementById('calGrid').addEventListener('click', (e) => {
  const cell = e.target.closest('.cal-cell');
  if(!cell || cell.classList.contains('empty')) return;
  viewDateKey = cell.dataset.date;
  renderAll();
  document.getElementById('tasks').scrollIntoView({behavior:'smooth', block:'center'});
});

document.getElementById('editExam').addEventListener('click', () => {
  const v = prompt('请输入初试日期（格式：2027-12-18）', state.examDate);
  if(v && /^\d{4}-\d{2}-\d{2}$/.test(v.trim())){
    state.examDate = v.trim(); save();
    const input = document.getElementById('setExamDate');
    if(input) input.value = state.examDate;
    renderAll();
  }
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `kaoyan-backup-${fmtDate(new Date())}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.records) throw new Error('文件格式不正确');
      for(const k in data.records) data.records[k] = migrateRecord(data.records[k]);
      if(Array.isArray(data.phases)) data.phases = data.phases.map(migratePhase);
      state = { ...cloneDefaults(), ...data };
      save();
      renderSettings();
      updateSettingsVisibility();
      renderAll();
      showToast('导入成功');
    }catch(err){
      alert('导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if(confirm('确定要清空所有打卡数据吗？此操作不可恢复。建议先导出备份。')){
    if(confirm('再次确认：所有打卡记录将被永久删除（学习目标设置会保留）。')){
      state.records = {};
      save();
      viewDateKey = null;
      renderAll();
    }
  }
});
